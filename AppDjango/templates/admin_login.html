{% extends "layout.html" %}

{% block content %}
<!-- Barra de Título -->
<div class="container-admin">
    <h4>ADMINISTRADOR </h4>
    <div class="text-section">
        <hr class="separator-line"> <!-- Línea separadora -->
        <p>LOGIN PARA USUARIO PERMITIDO</p>
    </div>
    <div>
        <div class="login-box login-container">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                {# Usuario #}
                <div class="mb-3">
                <label for="{{ form.username.id_for_label }}">USUARIO</label>
                {{ form.username }}
                </div>
                    <br>
                {# Clave #}
                <div class="mb-3">
                <label for="{{ form.password.id_for_label }}">CLAVE</label>
                {{ form.password }}
                </div>

                <button type="submit" class="login-button">ENTRAR</button>
            </form>
        </div>
