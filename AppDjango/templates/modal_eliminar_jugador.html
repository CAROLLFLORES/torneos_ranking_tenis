<!-- Modal para eliminar jugador -->
<div class="modal fade" id="eliminarModal-{{ jugador.dni }}" tabindex="-1" aria-labelledby="eliminarModalLabel-{{ jugador.dni }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content1">
            <div class="modal-header1">
                <h3 class="modal-title" >
                    Eliminar jugador
                </h3>
                <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div style="margin: 2rem auto">
                <h3 class="modal-title" style="color: white !important;" id="eliminarModalLabel-{{ jugador.dni }}">¿Está seguro desea eliminar al jugador {{ jugador.apellido }} {{ jugador.nombre }}?</h3>
            </div>
            <div class="btn-filtros">
                <a href="{% url 'borrar_jugador' jugador.dni %}" class="login-button rojo delete-button">ELIMINAR </a>
            </div>

        </div>
    </div>
    <!-- Modal para eliminar jugador -->
</div>
