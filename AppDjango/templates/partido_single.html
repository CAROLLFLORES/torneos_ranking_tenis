{% extends "layout.html" %}
{% load static %}

{% block body_class %}fondo-secundario{% endblock %}

{% block content %}
<div class="container-admin">
    <h4 class="text-center">ADMINISTRADOR</h4>
    <div class="text-section">
        <hr class="separator-line">
        <h2 class="text-primary text-center">Torneo: {{ torneo.nombre|upper }}</h2>
    </div>

    <!-- Modal de advertencia -->
    <div class="modal fade" id="modalAdvertencia" tabindex="-1" aria-labelledby="modalAdvertenciaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="modalAdvertenciaLabel">Advertencia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalAdvertenciaMensaje">
                    <!-- Mensaje dinámico de la advertencia -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="btnCancelar">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnContinuar">Seguir de todas formas</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Campo para ingresar el número de jornada -->
    <div class="text-center mb-3">
        <form id="numeroJornadaForm" class="d-inline">
            <label for="numero_jornada" class="form-label">Jornada:</label>
            <input type="number" id="numero_jornada" name="numero_jornada" class="form-control d-inline w-auto"
                value="{{ numero_jornada }}" required style="display: inline-block; width: 80px; text-align: center;">
        </form>
    </div>

    <!-- Formulario para agregar partidos -->
    <form method="POST" action="{% url 'guardar_fecha' torneo.id %}" id="formPartidos">
        {% csrf_token %}
        <div class="table-responsive">
            <table class="table table-striped table-light table-bordered table-sm">
                <thead class="table-success text-center">
                    <tr>
                        <th>Jugador 1</th>
                        <th>VS</th>
                        <th>Jugador 2</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Cancha</th>
                        <th>ELIMINAR</th>
                    </tr>
                </thead>
                <tbody id="partidosTable">
                    <tr>
                        <td>
                            <select name="jugador1[]" class="form-select form-select-sm" required>
                                <option value="" disabled selected>Seleccionar Jugador 1</option>
                                {% for jugador in jugadores %}
                                    <option value="{{ jugador.id }}">{{ jugador.apellido }}, {{ jugador.nombre }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td class="text-center">VS</td>
                        <td>
                            <select name="jugador2[]" class="form-select form-select-sm" required>
                                <option value="" disabled selected>Seleccionar Jugador 2</option>
                                {% for jugador in jugadores %}
                                    <option value="{{ jugador.id }}">{{ jugador.apellido }}, {{ jugador.nombre }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="date" name="fecha[]" class="form-control form-control-sm" required></td>
                        <td><input type="time" name="hora[]" class="form-control form-control-sm" required></td>
                        <td>
                            <select name="cancha[]" class="form-select form-select-sm" required>
                                <option value="" disabled selected>Seleccionar Cancha</option>
                                {% for cancha in canchas %}
                                    <option value="{{ cancha.id }}">Cancha {{ cancha.cancha }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Botones centrados -->
        <div class="text-center mt-4">
            <div class="btn-group" role="group">
                <button type="submit" class="btn btn-success" id="guardarFechaButton">Generar Jornada</button>
                <button type="button" id="addRowButton" class="btn btn-warning">Agregar Nueva Fila</button>
                <button type="button" class="btn btn-info" onclick="imprimirPagina()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
            </div>
        </div>
    </form>
</div>

<script>
    let continuar = false; // Variable para permitir la continuación manual

    // Validar si hay conflictos de horario y cancha o duplicados
    function validarDuplicadosYConflictos(fila) {
        const jugador1 = fila.querySelector('select[name="jugador1[]"]').value;
        const jugador2 = fila.querySelector('select[name="jugador2[]"]').value;
        const fecha = fila.querySelector('input[name="fecha[]"]').value;
        const hora = fila.querySelector('input[name="hora[]"]').value;
        const cancha = fila.querySelector('select[name="cancha[]"]').value;
    
        const filas = document.querySelectorAll('#partidosTable tr');
        for (let otraFila of filas) {
            if (otraFila === fila) continue; // Saltar la fila actual
    
            const jugador1Otro = otraFila.querySelector('select[name="jugador1[]"]').value;
            const jugador2Otro = otraFila.querySelector('select[name="jugador2[]"]').value;
            const fechaOtro = otraFila.querySelector('input[name="fecha[]"]').value;
            const horaOtro = otraFila.querySelector('input[name="hora[]"]').value;
            const canchaOtro = otraFila.querySelector('select[name="cancha[]"]').value;
    
            // Validar partidos idénticos (mismos jugadores en cualquier orden)
            if (
                (jugador1 === jugador1Otro && jugador2 === jugador2Otro) ||
                (jugador1 === jugador2Otro && jugador2 === jugador1Otro)
            ) {
                if (fecha === fechaOtro && hora === horaOtro && cancha === canchaOtro) {
                    if (!continuar) {
                        mostrarModal(
                            'Advertencia: Este partido ya existe en otra fila. ¿Desea continuar?',
                            () => { continuar = true; },
                            () => { continuar = false; }
                        );
                        return false;
                    }
                }
            }
    
            // Validar conflictos de horario y cancha con jugadores diferentes
            if (
                fecha === fechaOtro &&
                hora === horaOtro &&
                cancha === canchaOtro &&
                (jugador1 !== jugador1Otro || jugador2 !== jugador2Otro)
            ) {
                if (!continuar) {
                    mostrarModal(
                        'Advertencia: Hay un conflicto de horario y cancha con otro partido. ¿Desea continuar?',
                        () => { continuar = true; },
                        () => { continuar = false; }
                    );
                    return false;
                }
            }
        }
        return true;
    }
    
    // Mostrar modal con mensaje
    function mostrarModal(mensaje, onContinuar, onCancelar) {
        const modalMensaje = document.getElementById('modalAdvertenciaMensaje');
        modalMensaje.innerHTML = mensaje;
    
        const btnContinuar = document.getElementById('btnContinuar');
        const btnCancelar = document.getElementById('btnCancelar');
    
        const modal = new bootstrap.Modal(document.getElementById('modalAdvertencia'));
    
        btnContinuar.onclick = () => {
            modal.hide();
            onContinuar();
        };
    
        btnCancelar.onclick = () => {
            modal.hide();
            onCancelar();
        };
    
        modal.show();
    }
    
    // Escuchar cambios en el formulario
    document.getElementById('partidosTable').addEventListener('change', function (event) {
        const fila = event.target.closest('tr');
        if (fila) {
            validarDuplicadosYConflictos(fila);
        }
    });
    
    // Agregar una nueva fila
    document.getElementById('addRowButton').addEventListener('click', function () {
        const tableBody = document.getElementById('partidosTable');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>
                <select name="jugador1[]" class="form-select form-select-sm" required>
                    <option value="" disabled selected>Seleccionar Jugador 1</option>
                    {% for jugador in jugadores %}
                        <option value="{{ jugador.id }}">{{ jugador.apellido }}, {{ jugador.nombre }}</option>
                    {% endfor %}
                </select>
            </td>
            <td class="text-center">VS</td>
            <td>
                <select name="jugador2[]" class="form-select form-select-sm" required>
                    <option value="" disabled selected>Seleccionar Jugador 2</option>
                    {% for jugador in jugadores %}
                        <option value="{{ jugador.id }}">{{ jugador.apellido }}, {{ jugador.nombre }}</option>
                    {% endfor %}
                </select>
            </td>
            <td><input type="date" name="fecha[]" class="form-control form-control-sm" required></td>
            <td><input type="time" name="hora[]" class="form-control form-control-sm" required></td>
            <td>
                <select name="cancha[]" class="form-select form-select-sm" required>
                    <option value="" disabled selected>Seleccionar Cancha</option>
                    {% for cancha in canchas %}
                        <option value="{{ cancha.id }}">Cancha {{ cancha.cancha }}</option>
                    {% endfor %}
                </select>
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">
                    <i class="bi bi-trash-fill"></i>
                </button>
            </td>
        `;
        tableBody.appendChild(newRow);
    });
    
    // Eliminar fila
    function eliminarFila(button) {
        const row = button.closest('tr');
        row.remove();
    }
    </script>


<style>
    .table-responsive {
        overflow-x: auto;
        width: 100%;
        max-width: 100%;
    }

    .btn-group {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    #numero_jornada {
        display: inline-block;
        width: 80px;
        text-align: center;
    }
</style>
{% endblock %}
